/* ─── Three.js deforming grid (sphere-under-cloth effect) ─── */
function initThreeSphere(container, opts) {
  const T = window.THREE;
  if (!T) return () => {};

  const o = Object.assign({
    cols: 52, rows: 40,         // grid resolution
    gridW: 50, gridH: 38,       // world units
    bulgeR: 9,                  // sphere influence radius
    bulgeH: 4.5,                // sphere height
    lerpSpeed: 0.07,            // how fast bulge tracks cursor
    autoSpeed: 0.007,           // auto-animation speed when no mouse
    lineOpacity: 0.65,
  }, opts);

  const { cols: C, rows: R, gridW: GW, gridH: GH } = o;
  const N = (C+1)*(R+1);

  const w = container.offsetWidth || window.innerWidth;
  const h = container.offsetHeight || window.innerHeight;

  /* Scene — transparent canvas, CSS background shows through */
  const scene  = new T.Scene();
  const camera = new T.PerspectiveCamera(58, w/h, 0.1, 200);
  camera.position.set(0, 0, 30);
  camera.lookAt(0, 0, 0);

  const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0, 0);
  Object.assign(renderer.domElement.style, {
    position:'absolute', top:0, left:0, width:'100%', height:'100%', pointerEvents:'none',
  });
  container.appendChild(renderer.domElement);

  /* Pre-compute base XY grid positions */
  const bx = new Float32Array(N);
  const by = new Float32Array(N);
  for (let r = 0; r <= R; r++)
    for (let c = 0; c <= C; c++) {
      const i = r*(C+1)+c;
      bx[i] = (c/C - 0.5)*GW;
      by[i] = (r/R - 0.5)*GH;
    }

  /* Line segment buffer: horiz + vert lines */
  const nSegs = (R+1)*C + R*(C+1);
  const pArr  = new Float32Array(nSegs*6);   // 2 verts * 3 floats per seg
  const cArr  = new Float32Array(nSegs*6);
  const zArr  = new Float32Array(N);          // current Z per point

  const geo   = new T.BufferGeometry();
  const pAttr = new T.BufferAttribute(pArr, 3);
  const cAttr = new T.BufferAttribute(cArr, 3);
  pAttr.setUsage(T.DynamicDrawUsage);
  cAttr.setUsage(T.DynamicDrawUsage);
  geo.setAttribute('position', pAttr);
  geo.setAttribute('color',    cAttr);
  scene.add(new T.LineSegments(geo,
    new T.LineBasicMaterial({ vertexColors:true, transparent:true, opacity: o.lineOpacity })
  ));

  /* Color LUT: flat (dark) → bulge peak (bright periwinkle) */
  const LUT = new Float32Array(256*3);
  const cA = new T.Color('#1a2869');
  const cB = new T.Color('#3644a5');
  const cC = new T.Color('#8878d8');
  for (let i = 0; i < 256; i++) {
    const t  = i/255;
    const c  = t < 0.5
      ? cA.clone().lerp(cB, t*2)
      : cB.clone().lerp(cC, (t-0.5)*2);
    LUT[i*3]=c.r; LUT[i*3+1]=c.g; LUT[i*3+2]=c.b;
  }

  /* Mouse tracking — lerped for smoothness */
  let tx=0, ty=0;   // target world pos
  let cx=0, cy=0;   // current (lerped)
  let autoT = 0;
  let hasMouse = false;

  /* Screen→world: project mouse onto z=0 plane */
  function screenToWorld(e) {
    const rect  = container.getBoundingClientRect();
    const nx    = (e.clientX - rect.left)/rect.width  * 2 - 1;
    const ny    = -((e.clientY - rect.top)/rect.height * 2 - 1);
    const fovH  = camera.fov * Math.PI/180;
    const halfH = Math.tan(fovH/2) * camera.position.z;
    const halfW = halfH * camera.aspect;
    return { x: nx*halfW, y: ny*halfH };
  }

  const onMove  = e => { const p=screenToWorld(e); tx=p.x; ty=p.y; hasMouse=true; };
  const onLeave = () => { hasMouse=false; };
  container.addEventListener('mousemove', onMove);
  container.addEventListener('mouseleave', onLeave);

  /* Animation */
  let raf;
  const tick = () => {
    raf = requestAnimationFrame(tick);
    autoT += o.autoSpeed;

    /* Auto figure-8 when idle */
    if (!hasMouse) {
      tx = Math.cos(autoT * 0.9)  * 12;
      ty = Math.sin(autoT * 1.3) * 7;
    }

    /* Lerp toward target */
    cx += (tx-cx)*o.lerpSpeed;
    cy += (ty-cy)*o.lerpSpeed;

    /* Compute Z per grid point (hemisphere formula) */
    for (let i = 0; i < N; i++) {
      const dx = bx[i]-cx, dy = by[i]-cy;
      const d  = Math.sqrt(dx*dx+dy*dy);
      const t  = d/o.bulgeR;
      zArr[i]  = t < 1 ? o.bulgeH*Math.sqrt(1-t*t) : 0;
    }

    /* Fill position + color buffer */
    let vi=0;
    const setV = (i) => {
      pArr[vi]=bx[i]; pArr[vi+1]=by[i]; pArr[vi+2]=zArr[i];
      const li = Math.min(255, Math.round(zArr[i]/o.bulgeH*255));
      cArr[vi]=LUT[li*3]; cArr[vi+1]=LUT[li*3+1]; cArr[vi+2]=LUT[li*3+2];
      vi+=3;
    };
    for (let r=0;r<=R;r++) for (let c=0;c<C;c++) { setV(r*(C+1)+c); setV(r*(C+1)+c+1); }
    for (let c=0;c<=C;c++) for (let r=0;r<R;r++) { setV(r*(C+1)+c); setV((r+1)*(C+1)+c); }

    pAttr.needsUpdate = true;
    cAttr.needsUpdate = true;
    renderer.render(scene, camera);
  };
  tick();

  const onResize = () => {
    const nw=container.offsetWidth, nh=container.offsetHeight;
    if (!nw || !nh) return;
    camera.aspect=nw/nh; camera.updateProjectionMatrix(); renderer.setSize(nw,nh);
  };
  window.addEventListener('resize', onResize);

  /* ResizeObserver keeps canvas synced with the section's real size,
     fixing cursor offset when layout settles after mount */
  let ro;
  if (window.ResizeObserver) {
    ro = new ResizeObserver(onResize);
    ro.observe(container);
  }
  // also re-sync once after first paint
  requestAnimationFrame(onResize);

  return () => {
    cancelAnimationFrame(raf);
    container.removeEventListener('mousemove', onMove);
    container.removeEventListener('mouseleave', onLeave);
    window.removeEventListener('resize', onResize);
    if (ro) ro.disconnect();
    renderer.dispose(); renderer.domElement.remove();
  };
}

const DOMINIOS_MAL = {
  'gmial.com':'gmail.com',   'gmai.com':'gmail.com',    'gmail.co':'gmail.com',
  'gmil.com':'gmail.com',    'gmaill.com':'gmail.com',  'gamil.com':'gmail.com',

  'yahooo.com':'yahoo.com',  'yaho.com':'yahoo.com',    'yahoo.co':'yahoo.com',
  'icloud.co':'icloud.com',  'live.co':'live.com',
};

/* Correo: siempre en minusculas. Los dominios no distinguen mayusculas
   y asi no entran "Ale@Gmail.com" y "ale@gmail.com" como dos personas. */
const limpiaCorreo = v => String(v || '').trim().toLowerCase().replace(/\s/g, '');

/* Nombres y empresas: Primera Letra De Cada Palabra En Mayuscula,
   para que no lleguen "ALEJANDRA CERECEDO" ni "alejandra cerecedo" */
const MINUSCULAS = ['de','del','la','las','los','y','e','en','el','a','al','por','para','con'];
const capitaliza = v => String(v || '').trim().replace(/\s+/g, ' ').toLowerCase()
  .split(' ')
  .map((w, i) => {
    if (i > 0 && MINUSCULAS.includes(w)) return w;
    if (/^(s\.a\.|s\.a\.p\.i\.|s\.c\.|sa|sapi|sc|srl|sas)$/.test(w)) return w.toUpperCase();
    return w.charAt(0).toUpperCase() + w.slice(1);
  })
  .join(' ');

/* Sugiere la correccion si el dominio esta mal escrito */
const sugiereCorreo = v => {
  const c = limpiaCorreo(v);
  const i = c.lastIndexOf('@');
  if (i < 0) return '';
  const dom = c.slice(i + 1);
  return DOMINIOS_MAL[dom] ? c.slice(0, i + 1) + DOMINIOS_MAL[dom] : '';
};

/* ─── FlipCard ─── */
function FlipCard({ front, back, height = 260 }) {
  const isMobile = useMobile();
  const [flipped, setFlipped] = useState(false);
  return (
    <div style={{ perspective: '1000px', height, cursor: 'pointer' }}
      onMouseEnter={() => !isMobile && setFlipped(true)}
      onMouseLeave={() => !isMobile && setFlipped(false)}
      onClick={() => setFlipped(f => !f)}>
      <div style={{ position:'relative', width:'100%', height:'100%', transformStyle:'preserve-3d',
        transition:'transform 0.55s cubic-bezier(0.4,0,0.2,1)',
        transform: flipped ? 'rotateY(180deg)' : 'rotateY(0deg)' }}>
        <div style={{ position:'absolute', inset:0, backfaceVisibility:'hidden' }}>{front}</div>
        <div style={{ position:'absolute', inset:0, backfaceVisibility:'hidden', transform:'rotateY(180deg)' }}>{back}</div>
      </div>
    </div>
  );
}

  const [paso, setPaso]       = useState(1);
  const [form, setForm]       = useState({ nombre:'', empresa:'', email:'', telefono:'', servicio:'', mensaje:'' });
  const [enviando, setEnviando] = useState(false);
  const [enviado, setEnviado]  = useState(false);
  const [fallo, setFallo]      = useState(false);

  const pct = Math.round((paso / TOTAL_PASOS) * 100);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  useEffect(() => {
    const fn = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', fn);
    return () => window.removeEventListener('keydown', fn);
  }, [onClose]);

  const canContinue = () => {
    if (paso === 1) return form.nombre.trim().length > 1;
    if (paso === 2) return true;   // opcional — se puede omitir
    if (paso === 3) return RE_CORREO.test(limpiaCorreo(form.email))
                        && form.telefono.replace(/\D/g, '').length >= 10;
    if (paso === 4) return form.servicio !== '';
    return true;
  };

  const siguiente = () => setPaso(p => p + 1);
  const anterior  = () => setPaso(p => p - 1);
  /* Pasos que se pueden omitir → limpia el campo y avanza */
  const OMITIBLES = { 2: 'empresa', 5: 'mensaje' };
  const omitir    = () => {
    const campo = OMITIBLES[paso];
    set(campo, '');
    if (paso === TOTAL_PASOS) enviar({ [campo]: '' });
    else siguiente();
  };

  /* Envío verificado: 'text/plain' evita el preflight de CORS, así que
     podemos LEER la respuesta del Apps Script y saber si de verdad llegó.
     Si falla, no perdemos el prospecto: le ofrecemos WhatsApp y correo
     ya llenos con sus datos. */
  const enviar = async (override = {}) => {
    setEnviando(true);
    setFallo(false);
    const crudo = { ...form, ...override };
    const datos = {
      ...crudo,
      nombre:  capitaliza(crudo.nombre),
      empresa: capitaliza(crudo.empresa),
      email:   limpiaCorreo(crudo.email),
    };
    setForm(datos);

    let ok = false;
    try {
      const ctrl = new AbortController();
      const reloj = setTimeout(() => ctrl.abort(), 15000);
      const res  = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ ...datos, fecha: new Date().toLocaleString('es-MX') }),
        redirect: 'follow',
        signal: ctrl.signal,
      });
      clearTimeout(reloj);
      if (res.ok) {
        const txt = await res.text();
        try { ok = JSON.parse(txt).status === 'ok'; }
        catch { ok = /\bok\b/i.test(txt); }   // por si responde texto plano
      }
    } catch (err) {
      console.error('[METRIQA] falló el envío del formulario:', err);
    }

    setEnviando(false);
    if (ok) setEnviado(true);
    else    setFallo(true);
  };

  /* ── Fallo: el envío no se pudo confirmar ── */
  if (fallo) {
    const resumen = [
      `Nombre: ${form.nombre}`,
      form.empresa && `Empresa: ${form.empresa}`,
      form.email   && `Correo: ${form.email}`,
      form.servicio && `Me interesa: ${form.servicio}`,
      form.mensaje && `Detalle: ${form.mensaje}`,
    ].filter(Boolean).join('\n');
    const waFallback = `https://wa.me/${WA_TEL.replace(/\D/g,'')}?text=` +
      encodeURIComponent('Hola METRIQA, llené el formulario del sitio pero no se envió. Estos son mis datos:\n\n' + resumen);
    const mailFallback = `mailto:${EMAIL}?subject=${encodeURIComponent('Solicitud de diagnóstico (el formulario del sitio falló)')}` +
      `&body=${encodeURIComponent('Hola METRIQA,\n\nLlené el formulario del sitio pero no se envió. Estos son mis datos:\n\n' + resumen)}`;

    return (
      <Overlay onClose={onClose}>
        <div style={{ textAlign:'center', padding:'44px 36px' }}>
          <div style={{ width:72, height:72, borderRadius:'50%', background:'rgba(189,135,207,0.15)',
            display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 22px',
            color:B.violetDeep, ...sora, fontSize:34, fontWeight:700 }}>!</div>
          <h3 style={{ ...sora, fontSize:25, fontWeight:700, color:B.graphite, lineHeight:1.2 }}>
            No pudimos enviar tu mensaje
          </h3>
          <p style={{ marginTop:12, fontSize:15, color:B.gray, lineHeight:1.65, maxWidth:380, margin:'12px auto 0' }}>
            Algo falló de nuestro lado, no tuyo. Escríbenos directo y ya llevamos tus datos cargados
            — no tienes que volver a escribirlos.
          </p>
          <a href={waFallback} target="_blank" rel="noopener noreferrer"
            style={{ ...sora, display:'flex', alignItems:'center', justifyContent:'center', gap:10,
              marginTop:28, padding:'15px', borderRadius:12, background:'#25D366', color:'#0B2E1A',
              fontSize:15, fontWeight:700 }}>
            <WhatsApp size={20} /> Enviar por WhatsApp
          </a>
          <a href={mailFallback}
            style={{ ...sora, display:'flex', alignItems:'center', justifyContent:'center', gap:10,
              marginTop:10, padding:'15px', borderRadius:12, border:`2px solid ${B.violetDeep}`,
              color:B.violetDeep, fontSize:15, fontWeight:600 }}>
            <Mail size={18} /> Enviar por correo
          </a>
          <button onClick={() => enviar()} disabled={enviando}
            style={{ ...mono, marginTop:18, background:'none', border:'none', fontSize:11,
              letterSpacing:'0.14em', color:B.gray, cursor: enviando ? 'wait' : 'pointer',
              textDecoration:'underline', textUnderlineOffset:3 }}>
            {enviando ? 'REINTENTANDO...' : 'REINTENTAR EL ENVÍO'}
          </button>
        </div>
      </Overlay>
    );
  }

  /* ── Éxito ── */
  if (enviado) return (
    <Overlay onClose={onClose}>
      <div style={{ textAlign:'center', padding:'48px 40px' }}>
        <div style={{ width:72, height:72, borderRadius:'50%', background:'rgba(189,135,207,0.15)',
          display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 24px',
          color:B.violetDeep }}>
          <Check size={34} />
        </div>
        <h3 style={{ ...sora, fontSize:28, fontWeight:700, color:B.graphite, lineHeight:1.15 }}>
          ¡Gracias, {form.nombre.split(' ')[0]}!
        </h3>
        <p style={{ marginTop:12, fontSize:15, color:B.gray, lineHeight:1.65, maxWidth:360, margin:'12px auto 0' }}>
          Recibimos tu mensaje. Nos pondremos en contacto contigo a la brevedad al correo <strong>{form.email}</strong>.
        </p>
        <button onClick={onClose} style={{ ...sora, marginTop:32, padding:'13px 32px',
          borderRadius:12, background:B.violetDeep, color:'#fff', border:'none',
          fontSize:14, fontWeight:600, cursor:'pointer' }}>
          Cerrar
        </button>
      </div>
    </Overlay>
  );

  /* ── Pasos ── */
  /* El foco se pone a mano: el atributo autoFocus falla en Safari cuando el
     campo se monta dentro de un contenedor con backdrop-filter */
  const campoRef = useRef(null);
  useEffect(() => {
    const t = setTimeout(() => { if (campoRef.current) campoRef.current.focus(); }, 60);
    return () => clearTimeout(t);
  }, [paso]);

  /* Avisos en vivo del paso 3 — solo cuando ya escribio algo, para no
     regañar a alguien que apenas empieza a teclear */
  const digitosTel  = form.telefono.replace(/\D/g, '').length;
  const correoMal   = form.email.length > 4 && !RE_CORREO.test(limpiaCorreo(form.email));
  const sugerencia  = sugiereCorreo(form.email);
  const telMal      = digitosTel > 0 && digitosTel < 10;

  const renderPaso = () => {
    if (paso === 1) return (
      <Paso pregunta="¿Cuál es tu nombre?" sub="Queremos saber quién eres">
        <input ref={campoRef} className="mq-field" type="text" placeholder="Tu nombre completo"
          value={form.nombre} onChange={e => set('nombre', e.target.value)}
          onKeyDown={e => e.key === 'Enter' && canContinue() && siguiente()} />
      </Paso>
    );
    if (paso === 2) return (
      <Paso pregunta="¿En qué empresa trabajas?" sub="Opcional — puedes omitirlo si prefieres">
        <input ref={campoRef} className="mq-field" type="text" placeholder="Nombre de tu empresa"
          value={form.empresa} onChange={e => set('empresa', e.target.value)}
          onKeyDown={e => e.key === 'Enter' && canContinue() && siguiente()} />
      </Paso>
    );
    if (paso === 3) return (
      <Paso pregunta="¿Cómo podemos contactarte?" sub="Tu correo y tu WhatsApp">
        <label style={{ ...mono, display:'block', marginBottom:7, fontSize:10,
          letterSpacing:'0.18em', color:B.gray }}>CORREO</label>
        <input ref={campoRef} className="mq-field" type="email" placeholder="tucorreo@ejemplo.com"
          autoCapitalize="none" autoCorrect="off" spellCheck={false}
          value={form.email} onChange={e => set('email', e.target.value)} />
        {correoMal && (
          <div style={{ ...sora, marginTop:8, fontSize:12.5, color:'#B0344A' }}>
            Ese correo no se ve completo. Debe ser como <em>nombre@empresa.com</em>
          </div>
        )}
        {sugerencia && (
          <div style={{ ...sora, marginTop:8, fontSize:12.5, color:B.gray }}>
            ¿Quisiste decir{' '}
            <button type="button" onClick={() => set('email', sugerencia)}
              style={{ ...sora, background:'none', border:'none', padding:0, cursor:'pointer',
                color:B.violetDeep, fontWeight:600, fontSize:12.5, textDecoration:'underline' }}>
              {sugerencia}
            </button>?
          </div>
        )}

        <label style={{ ...mono, display:'block', margin:'16px 0 7px', fontSize:10,
          letterSpacing:'0.18em', color:B.gray }}>WHATSAPP</label>
        <input className="mq-field" type="tel" placeholder="+52 55 0000 0000"
          value={form.telefono} onChange={e => set('telefono', e.target.value)}
          onKeyDown={e => e.key === 'Enter' && canContinue() && siguiente()} />
        {telMal && (
          <div style={{ ...sora, marginTop:8, fontSize:12.5, color:'#B0344A' }}>
            Faltan dígitos: necesitamos los 10 de tu WhatsApp ({digitosTel} de 10)
          </div>
        )}
      </Paso>
    );
    if (paso === 4) return (
      <Paso pregunta="¿Qué quieres construir?" sub="Elige lo más cercano — lo afinamos en la llamada">
        <div style={{ display:'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap:10, marginTop:4 }}>
          {SERVICIOS_OPC.map(s => (
            <button key={s.id} onClick={() => set('servicio', s.label)}
              style={{ ...sora, padding:'14px 16px', borderRadius:12, fontSize:13, fontWeight:500,
                cursor:'pointer', textAlign:'left', lineHeight:1.35, transition:'all .15s',
                border: form.servicio === s.label ? `2px solid ${B.violetDeep}` : `2px solid rgba(65,65,64,0.15)`,
                background: form.servicio === s.label ? B.violet10 : '#fff',
                color: form.servicio === s.label ? B.violetDeep : B.graphite }}>
              {s.label}
            </button>
          ))}
        </div>
      </Paso>
    );
    if (paso === 5) return (
      <Paso pregunta="¿Algo más que quieras contarnos?" sub="Cuéntanos sobre tu situación (opcional)">
        <textarea ref={campoRef} className="mq-field" rows={4}
          placeholder="Describe brevemente tu necesidad..."
          value={form.mensaje} onChange={e => set('mensaje', e.target.value)} />
      </Paso>
    );
  };

  return (
    <Overlay onClose={onClose}>
      {/* Progress */}
      <div style={{ padding:'24px 32px 0' }}>
        <div style={{ ...mono, display:'flex', justifyContent:'space-between',
          fontSize:11, letterSpacing:'0.15em', color:B.gray, marginBottom:10 }}>
          <span>Paso {paso} de {TOTAL_PASOS}</span>
          <span style={{ color:B.violetDeep, fontWeight:500 }}>{pct}%</span>
        </div>
        <div style={{ height:6, borderRadius:999, background:'rgba(65,65,64,0.10)' }}>
          <div style={{ height:'100%', borderRadius:999, background:B.violetDeep,
            width:`${pct}%`, transition:'width 0.4s ease' }} />
        </div>
      </div>

      {/* Contenido del paso */}
      <div style={{ padding:'8px 32px 0' }}>
        {renderPaso()}
      </div>

      {/* Botones */}
      <div style={{ padding:'20px 32px 32px',
        display:'grid', gap:10,
        gridTemplateColumns: paso > 1 ? '1fr 2fr' : '1fr' }}>
        {paso > 1 && (
          <button onClick={anterior} style={{ ...sora, padding:'14px', borderRadius:12,
            background:'rgba(65,65,64,0.08)', border:'none', fontSize:14, fontWeight:600,
            color:B.graphite, cursor:'pointer' }}>
            Atrás
          </button>
        )}
        {OMITIBLES[paso] && (
          <button onClick={omitir} disabled={enviando}
            style={{ ...mono, gridColumn:'1 / -1', order:2, padding:'6px', background:'none',
              border:'none', fontSize:11, letterSpacing:'0.14em', color:B.gray,
              cursor: enviando ? 'not-allowed' : 'pointer', textDecoration:'underline',
              textUnderlineOffset:3 }}>
            OMITIR ESTE PASO →
          </button>
        )}
        {paso < TOTAL_PASOS ? (
          <button onClick={siguiente} disabled={!canContinue()}
            style={{ ...sora, padding:'14px', borderRadius:12, border:'none', fontSize:14,
              fontWeight:700, cursor: canContinue() ? 'pointer' : 'not-allowed', transition:'opacity .15s',
              opacity: canContinue() ? 1 : 0.4, color:'#fff',
              background:`linear-gradient(135deg, ${B.violetDeep} 0%, ${B.violet} 100%)` }}>
            Continuar
          </button>
        ) : (
          <button onClick={() => enviar()} disabled={enviando}
            style={{ ...sora, padding:'14px', borderRadius:12, border:'none', fontSize:14,
              fontWeight:700, cursor: enviando ? 'not-allowed' : 'pointer',
              opacity: enviando ? 0.7 : 1, color:'#fff',
              background:`linear-gradient(135deg, ${B.violetDeep} 0%, ${B.violet} 100%)` }}>
            {enviando ? 'Enviando...' : 'Enviar mensaje'}
          </button>
        )}
      </div>

      {/* Cerrar */}
      <button onClick={onClose} style={{ position:'absolute', top:16, right:16,
        width:36, height:36, borderRadius:'50%', border:'none', cursor:'pointer',
        background:'rgba(65,65,64,0.08)', color:B.gray,
        display:'flex', alignItems:'center', justifyContent:'center' }}>
        <X size={18} />
      </button>
    </Overlay>
  );
}

function Overlay({ onClose, children }) {
  const isMobile = useMobile();
  return (
    <div style={{ position:'fixed', inset:0, zIndex:200, display:'flex',
      alignItems: isMobile ? 'flex-end' : 'center',
      justifyContent:'center',
      padding: isMobile ? 0 : 24,
      background:'rgba(1,11,36,0.65)', backdropFilter:'blur(6px)' }}
      onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ position:'relative', width:'100%', maxWidth:520,
        background:'#fff',
        borderRadius: isMobile ? '20px 20px 0 0' : 20,
        boxShadow:'0 32px 80px rgba(0,0,0,0.3)',
        maxHeight: isMobile ? '92vh' : '90vh',
        overflowY:'auto', overflowX:'hidden',
        WebkitOverflowScrolling:'touch' }}>
        {children}
      </div>
    </div>
  );
}

function Paso({ pregunta, sub, children }) {
  return (
    <div style={{ padding:'28px 0 16px', textAlign:'center' }}>
      <h2 style={{ ...sora, fontSize:'clamp(1.4rem,3vw,1.75rem)', fontWeight:700,
        color:B.graphite, lineHeight:1.2 }}>{pregunta}</h2>
      <p style={{ marginTop:8, fontSize:14, color:B.gray }}>{sub}</p>
      <div style={{ marginTop:24, textAlign:'left' }}>{children}</div>
    </div>
  );
}

function MacBook({ progress }) {
  const isMobile = useMobile();
  // compu-final.png is 360×360 — transparent screen area measured exactly:
  // screen px: top=80 bottom=269 left=10 right=349 (in 360×360 source)
  // → top=22.2% bottom_from_bottom=25.3% left=2.8% right_from_right=3.1%
  const W = isMobile ? 290 : 520;
  const H = W; // square image

  const rotX   = -(1 - progress) * 62;
  const dashOp = Math.max(0, Math.min(1, (progress - 0.45) / 0.4));

  return (
    <div style={{
      perspective: isMobile ? 600 : 900,
      perspectiveOrigin: '50% 35%',
      userSelect: 'none',
      filter: 'drop-shadow(0 20px 40px rgba(0,0,0,0.25))',
    }}>
      <div style={{
        width: W, height: H,
        transform: `rotateX(${rotX}deg)`,
        transformOrigin: '50% 92%',
        position: 'relative',
      }}>

        {/* Dashboard sits behind the transparent screen area */}
        <div style={{
          position: 'absolute',
          top: '23%', left: '10.6%', right: '10.6%', bottom: '25.3%',
          overflow: 'hidden',
          opacity: dashOp,
          background: '#fff',
        }}>
          <img

            style={{
              width: '100%', height: '100%',

            position: 'absolute', inset: 0,
            width: '100%', height: '100%',
            display: 'block',
          }}
        />

      </div>
    </div>
  );
}

   PANEL
════════════════════════════════════════ */
function Panel() {
  const isMobile = useMobile();
  const macRef    = useRef(null);
  const targetRef = useRef(0);
  const currentRef= useRef(0);
  const [mbProgress, setMbProgress] = useState(0);

  useEffect(() => {
    let animId;

    const onScroll = () => {
      const el = macRef.current;
      if (!el) return;
      const rect  = el.getBoundingClientRect();
      const vh    = window.innerHeight;
      const elCy  = rect.top + rect.height / 2;
      const dist  = Math.abs(elCy - vh / 2);
      // 1 when centred in viewport, 0 when far above or below — closes both ways
      targetRef.current = Math.max(0, Math.min(1, 1 - dist / (vh * 0.52)));
    };

    const loop = () => {
      const c = currentRef.current;
      const t = targetRef.current;
      const n = c + (t - c) * 0.09; // lerp — silky smooth
      if (Math.abs(n - c) > 0.0003) {
        currentRef.current = n;
        setMbProgress(n);
      }
      animId = requestAnimationFrame(loop);
    };

    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    animId = requestAnimationFrame(loop);
    return () => {
      window.removeEventListener('scroll', onScroll);
      cancelAnimationFrame(animId);
    };
  }, []);

  return (
    <section id="panel" style={{ padding: isMobile ? '72px 0' : '112px 0', background:B.paper }}>
      <div style={{ maxWidth:1152, margin:'0 auto', padding:'0 24px', display:'grid',
        gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr',
        gap: isMobile ? 40 : 64, alignItems:'center' }}>

          <SectionLabel>EL PANEL · 04</SectionLabel>
          <h2 style={{ ...sora, marginTop:16, fontWeight:700, color:B.graphite, fontSize:'clamp(2rem,4vw,2.75rem)', lineHeight:1.1, letterSpacing:'-0.02em' }}>
            Datos dispersos,<br /><span style={{ color:B.violetDeep }}>decisiones claras.</span>
          </h2>
          <p style={{ marginTop:24, fontSize:16, lineHeight:1.65, color:B.gray }}>
            Cada sistema que construimos incluye su propio panel: los indicadores de tu operación en un solo lugar, actualizados, listos para decidir sin pedirle un reporte a nadie.
          </p>
          <ul style={{ marginTop:32, display:'flex', flexDirection:'column', gap:12 }}>
            {['Todos tus indicadores en un solo lugar','Diseñado para dirección y consejo','De la dispersión al criterio accionable'].map(t=>(
              <li key={t} style={{ display:'flex', alignItems:'flex-start', gap:12, fontSize:15, color:B.graphite }}>
                <span style={{ marginTop:8, width:8, height:8, flexShrink:0, background:B.violet, display:'inline-block' }} />{t}
              </li>
            ))}

  );

            style={{ display:'flex', alignItems:'center', justifyContent:'center',
              width:36, height:36, borderRadius:10, color:'rgba(255,255,255,0.65)',
              border:'1px solid rgba(255,255,255,0.15)', transition:'all .15s' }}
            onMouseOver={e => { e.currentTarget.style.color=B.violet;
                                e.currentTarget.style.borderColor='rgba(189,135,207,0.5)'; }}
            onMouseOut={e => { e.currentTarget.style.color='rgba(255,255,255,0.65)';
                               e.currentTarget.style.borderColor='rgba(255,255,255,0.15)'; }}>
            <Instagram size={18} sw={1.7} />
          </a>
        </div>
        <div style={{ ...mono, fontSize:11, letterSpacing:'0.22em', color:'rgba(255,255,255,0.40)' }}>
          EL PUNTO EXACTO ENTRE CRITERIO Y DATO
        </div>
        <div style={{ ...mono, fontSize:11, color:'rgba(255,255,255,0.40)' }}>
          © {new Date().getFullYear()} METRIQA · v1.0
        </div>
      </div>
    </footer>
  );
}

/* ════════════════════════════════════════
   APP
════════════════════════════════════════ */
function App() {
  const [modalOpen, setModalOpen] = useState(false);
  const [isMobile, setIsMobile]   = useState(window.innerWidth < 768);
  const openForm  = useCallback(() => setModalOpen(true),  []);
  const closeForm = useCallback(() => setModalOpen(false), []);

  useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);

  return (
    <MQ.Provider value={isMobile}>
      <div style={{ minHeight:'100vh', background:B.paper, color:B.graphite, ...sora }}>
        <Hero      onOpenForm={openForm} />
        <Esencia />
        <Servicios />
        <Diferenciador />
        <Panel />
        <Contacto  onOpenForm={openForm} />
        <Footer />
        {modalOpen && <FormModal onClose={closeForm} />}
      </div>
    </MQ.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
